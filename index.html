<!doctype html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calendário de Inventários</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script>
        (function() {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var set = function() {
                document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
            };
            set();
            if (mq.addEventListener) mq.addEventListener('change', set);
            else if (mq.addListener) mq.addListener(set);
        })();
    </script>
    <style>
        /* ============ Paleta: cinza, azul claro, preto e branco ============ */
        
         :root,
        [data-bs-theme="light"] {
            --fundo: #FFFFFF;
            --texto: #111111;
            --suave: #6B7079;
            /* cinza texto secundário */
            --linha: #E6E8EB;
            /* cinza divisórias */
            --cinza-bg: #F4F5F7;
            /* cinza fundo leve */
            --azul: #CFE3F7;
            /* azul claro */
            --azul-forte: #6FA8DC;
            /* azul claro mais saturado (foco/realce) */
            --azul-ink: #0F2A44;
            /* status */
            --ag-bg: var(--azul);
            --ag-tx: var(--azul-ink);
            /* Agendado */
            --an-bg: #111111;
            --an-tx: #FFFFFF;
            /* Em andamento */
            --fi-bg: #D9DCE0;
            --fi-tx: #3F444C;
            /* Finalizado */
        }
        
        [data-bs-theme="dark"] {
            --fundo: #111214;
            --texto: #F4F5F7;
            --suave: #9AA0A8;
            --linha: #2A2D32;
            --cinza-bg: #1A1C20;
            --azul: #2C4A66;
            --azul-forte: #8BBBE6;
            --azul-ink: #E3F0FC;
            --ag-bg: var(--azul);
            --ag-tx: var(--azul-ink);
            --an-bg: #FFFFFF;
            --an-tx: #111111;
            --fi-bg: #3A3E45;
            --fi-tx: #D5D8DD;
        }
        
         :root {
            --bs-body-font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --bs-body-font-size: .875rem;
            --bs-body-bg: var(--fundo);
            --bs-body-color: var(--texto);
            --bs-border-color: var(--linha);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        html,
        body {
            height: 100%;
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }
        
        body {
            background: var(--fundo);
            color: var(--texto);
            -webkit-font-smoothing: antialiased;
        }
        
        .tabular {
            font-variant-numeric: tabular-nums;
        }
        /* Controles flat */
        
        .form-control,
        .form-select {
            border-radius: 6px;
            border-color: var(--linha);
            background-color: var(--fundo);
            color: var(--texto);
            box-shadow: none;
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: var(--azul-forte);
            box-shadow: 0 0 0 3px rgba(111, 168, 220, .25);
        }
        
        .btn {
            border-radius: 6px;
            font-weight: 600;
            box-shadow: none !important;
        }
        
        .btn-preto {
            background: var(--texto);
            color: var(--fundo);
            border: 1px solid var(--texto);
        }
        
        .btn-preto:hover,
        .btn-preto:focus {
            background: var(--suave);
            border-color: var(--suave);
            color: var(--fundo);
        }
        
        .btn-linha {
            background: transparent;
            color: var(--texto);
            border: 1px solid var(--linha);
        }
        
        .btn-linha:hover {
            background: var(--cinza-bg);
            color: var(--texto);
        }
        
        .btn-icone {
            width: 32px;
            height: 32px;
            display: inline-grid;
            place-items: center;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--suave);
            padding: 0;
        }
        
        .btn-icone:hover {
            background: var(--cinza-bg);
            color: var(--texto);
        }
        
         :focus-visible {
            outline: 2px solid var(--azul-forte);
            outline-offset: 1px;
        }
        /* ============ Estrutura ============ */
        
        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .topo {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px 12px;
            flex-wrap: wrap;
            padding: 10px 20px;
            border-bottom: 1px solid var(--linha);
            background: var(--fundo);
        }
        
        .marca {
            font-weight: 700;
            font-size: .9375rem;
            letter-spacing: -.01em;
            margin-right: 4px;
            white-space: nowrap;
        }
        
        .ano-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .ano-nav .ano {
            font-size: 1.125rem;
            font-weight: 700;
            min-width: 52px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        
        .filtros {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        
        .filtros .form-control {
            width: 240px;
        }
        
        .filtros .form-select {
            width: auto;
            max-width: 190px;
        }
        
        .barra {
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px 18px;
            flex-wrap: wrap;
            padding: 8px 20px;
            color: var(--suave);
            font-size: .75rem;
            border-bottom: 1px solid var(--linha);
        }
        
        .barra b {
            color: var(--texto);
            font-weight: 600;
        }
        
        .leg {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: inherit;
            border-radius: 999px;
            padding: 2px 8px 2px 6px;
            font: inherit;
        }
        
        .leg:hover {
            border-color: var(--linha);
            background: var(--cinza-bg);
            color: var(--texto);
        }
        
        .leg.on {
            border-color: var(--texto);
            color: var(--texto);
            background: var(--cinza-bg);
        }
        
        .dica-uso {
            color: var(--suave);
        }
        
        .leg i {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }
        
        .barra .resumo {
            margin-left: auto;
        }
        /* ============ Ano inteiro ============ */
        
        .ano-grade {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 16px 20px 20px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(220px, 1fr));
            gap: 14px;
        }
        
        .mes {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            padding: 10px 10px 8px;
            border: 1px solid var(--linha);
            border-radius: 10px;
            background: var(--fundo);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        
        .mes:hover {
            border-color: var(--suave);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
        }
        
        .mes.atual {
            border-color: var(--azul-forte);
            box-shadow: 0 0 0 1px var(--azul-forte) inset;
        }
        
        .mes.atual:hover {
            box-shadow: 0 0 0 1px var(--azul-forte) inset, 0 4px 14px rgba(0, 0, 0, .06);
        }
        
        .mes-cab {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 2px 6px;
        }
        
        .mes-cab h2 {
            font-size: .9375rem;
            font-weight: 700;
            margin: 0;
        }
        
        .mes-cab span {
            font-size: .75rem;
            color: var(--suave);
            font-variant-numeric: tabular-nums;
        }
        
        .mes.atual .mes-cab h2::after {
            content: 'mês atual';
            margin-left: 8px;
            font-size: .625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--azul-ink);
            background: var(--azul);
            padding: 2px 6px;
            border-radius: 999px;
            vertical-align: 2px;
        }
        
        .dsem {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        
        .dsem span {
            text-align: center;
            font-size: .6875rem;
            font-weight: 600;
            color: var(--suave);
            padding-bottom: 4px;
        }
        
        .dias {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: repeat(6, minmax(0, 1fr));
            gap: 3px;
            min-height: 0;
        }
        
        .dia {
            position: relative;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--texto);
            font-size: .8125rem;
            font-weight: 500;
            padding: 0;
            min-height: 24px;
            display: grid;
            place-items: center;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: background-color .12s ease, transform .12s ease;
        }
        /* dia vazio: hover azul claro com "+" indicando que dá para cadastrar */
        
        .dia:not(.ag):not(.an):not(.fi):hover {
            background: var(--cinza-bg);
            box-shadow: inset 0 0 0 1px var(--azul-forte);
        }
        
        .dia:not(.ag):not(.an):not(.fi):hover::after {
            content: '+';
            position: absolute;
            top: 0;
            right: 3px;
            font-size: .625rem;
            font-weight: 700;
            color: var(--azul-forte);
        }
        
        .dia.fds {
            color: var(--suave);
        }
        
        .dia.hoje {
            box-shadow: inset 0 0 0 2px var(--texto);
            font-weight: 700;
        }
        
        .dia.ag {
            background: var(--ag-bg);
            color: var(--ag-tx);
            font-weight: 700;
        }
        
        .dia.an {
            background: var(--an-bg);
            color: var(--an-tx);
            font-weight: 700;
        }
        
        .dia.fi {
            background: var(--fi-bg);
            color: var(--fi-tx);
            font-weight: 700;
        }
        
        .dia.ag:hover,
        .dia.an:hover,
        .dia.fi:hover {
            transform: scale(1.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
            z-index: 1;
        }
        
        .dia.hoje.an {
            box-shadow: inset 0 0 0 2px var(--an-bg), inset 0 0 0 4px var(--fundo);
        }
        
        .dia .qtd {
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: .5625rem;
            font-weight: 700;
            line-height: 1;
            opacity: .85;
        }
        
        .dia.oculto {
            visibility: hidden;
            pointer-events: none;
        }
        
        .dia.ativo {
            outline: 2px solid var(--azul-forte);
            outline-offset: 1px;
        }
        
        @media (max-width: 1199.98px) {
            .ano-grade {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: none;
                grid-auto-rows: 260px;
            }
        }
        
        @media (max-width: 991.98px) {
            .filtros {
                margin-left: 0;
                width: 100%;
            }
            .filtros .form-control {
                flex: 1 1 200px;
                width: auto;
            }
            .barra .resumo {
                margin-left: 0;
                width: 100%;
            }
        }
        
        @media (max-width: 767.98px) {
            .ano-grade {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-auto-rows: 250px;
                padding: 12px;
                gap: 16px 14px;
            }
            .topo,
            .barra {
                padding-left: 12px;
                padding-right: 12px;
            }
        }
        
        @media (max-width: 479.98px) {
            .ano-grade {
                grid-template-columns: 1fr;
                grid-auto-rows: 280px;
            }
            .filtros .form-select {
                flex: 1 1 30%;
                max-width: none;
            }
        }
        /* ============ Prévia ao passar o mouse ============ */
        
        .previa {
            position: fixed;
            z-index: 1070;
            pointer-events: none;
            max-width: 260px;
            background: var(--texto);
            color: var(--fundo);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: .75rem;
            line-height: 1.45;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
        }
        
        .previa b {
            display: block;
            font-size: .8125rem;
            margin-bottom: 2px;
        }
        
        .previa .ln {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .previa .acao {
            opacity: .7;
            margin-top: 4px;
        }
        
        .previa .quad {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .55);
        }
        
        [data-bs-theme="dark"] .previa .quad {
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .45);
        }
        
        @media (hover: none) {
            .previa {
                display: none !important;
            }
        }
        /* ============ Popover (lista do dia / detalhes) ============ */
        
        .pop {
            position: fixed;
            z-index: 1060;
            width: 340px;
            max-width: calc(100vw - 16px);
            background: var(--fundo);
            color: var(--texto);
            border: 1px solid var(--linha);
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .14);
            padding: 8px 8px 14px;
        }
        
        .pop .topo-pop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 6px 10px;
        }
        
        .pop .data-pop {
            font-weight: 700;
            font-size: .9375rem;
        }
        
        .pop .item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            border-radius: 6px;
            padding: 8px 10px;
            text-align: left;
            color: var(--texto);
        }
        
        .pop .item:hover {
            background: var(--cinza-bg);
        }
        
        .quad {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex: none;
        }
        
        .q-ag {
            background: var(--ag-bg);
            box-shadow: inset 0 0 0 1px rgba(15, 42, 68, .15);
        }
        
        .q-an {
            background: var(--an-bg);
        }
        
        .q-fi {
            background: var(--fi-bg);
        }
        
        .selo {
            display: inline-block;
            font-size: .6875rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
        }
        
        .s-ag {
            background: var(--ag-bg);
            color: var(--ag-tx);
        }
        
        .s-an {
            background: var(--an-bg);
            color: var(--an-tx);
        }
        
        .s-fi {
            background: var(--fi-bg);
            color: var(--fi-tx);
        }
        
        .pop .linha {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 0 6px;
            padding: 5px 10px;
            align-items: start;
        }
        
        .pop .linha svg {
            color: var(--suave);
            margin-top: 2px;
        }
        
        .pop h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
        }
        
        .suave {
            color: var(--suave);
        }
        /* ============ Modal ============ */
        
        .modal {
            --bs-modal-bg: var(--fundo);
            --bs-modal-color: var(--texto);
            --bs-modal-border-radius: 10px;
            --bs-modal-border-color: var(--linha);
        }
        
        .info-loja {
            background: var(--cinza-bg);
            border-radius: 8px;
        }
        
        .lista-lojas {
            max-height: 240px;
            overflow-y: auto;
        }
        
        .list-group-item.active {
            background: var(--azul);
            color: var(--azul-ink);
            border-color: var(--azul);
        }
        
        .toast {
            --bs-toast-bg: var(--texto);
            --bs-toast-color: var(--fundo);
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- ===================== HEADER ===================== -->
        <header class="topo">
            <span class="marca">Inventários</span>
            <div class="ano-nav">
                <button type="button" class="btn-icone" data-nav="-1" aria-label="Ano anterior" title="Ano anterior (←)">
                        <svg width="16" height="16" viewBox="0 0 20 20"
                            aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"
                                fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" /></svg>
                    </button>
                <span class="ano" id="ano"></span>
                <button type="button" class="btn-icone" data-nav="1" aria-label="Próximo ano" title="Próximo ano (→)">
                        <svg width="16" height="16" viewBox="0 0 20 20"
                            aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"
                                fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" /></svg>
                    </button>
            </div>

            <div class="filtros" role="search">
                <input type="search" class="form-control form-control-sm" id="f-busca" placeholder="Buscar filial, loja, cidade, responsável" aria-label="Buscar">
                <select class="form-select form-select-sm" id="f-status" aria-label="Status"><option value>Todos os
                            status</option></select>
                <select class="form-select form-select-sm" id="f-uf" aria-label="UF"><option value>Todas as
                            UFs</option></select>
                <select class="form-select form-select-sm" id="f-equipe" aria-label="Equipe"><option value>Todas as
                            equipes</option></select>
                <button type="button" class="btn btn-sm btn-linha d-none" id="btn-limpar">Limpar</button>
                <button type="button" class="btn btn-sm btn-preto" id="btn-novo" title="Novo inventário (C)">+ Novo
                        inventário</button>
            </div>
        </header>

        <!-- Legenda + resumo -->
        <div class="barra" aria-label="Legenda e resumo">
            <button type="button" class="leg" data-leg="Agendado" title="Mostrar só os agendados"><i
                        style="background: var(--ag-bg)"></i>Agendado</button>
            <button type="button" class="leg" data-leg="Em andamento" title="Mostrar só os de hoje"><i
                        style="background: var(--an-bg)"></i>Em andamento
                    (hoje)</button>
            <button type="button" class="leg" data-leg="Finalizado" title="Mostrar só os finalizados"><i
                        style="background: var(--fi-bg)"></i>Finalizado</button>
            <span class="dica-uso d-none d-lg-inline">Clique em um dia para
                    ver ou cadastrar</span>
            <span class="resumo" id="resumo"></span>
        </div>

        <!-- ===================== ANO ===================== -->
        <main class="ano-grade" id="ano-grade" aria-live="polite"></main>
    </div>

    <div class="pop d-none" id="pop" role="dialog" aria-label="Inventários do dia"></div>
    <div class="previa d-none" id="previa" aria-hidden="true"></div>

    <!-- ===================== MODAL ===================== -->
    <div class="modal fade" id="modal-inv" tabindex="-1" aria-labelledby="titulo-form" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
            <form class="modal-content" id="form-inv" novalidate>
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title h5 fw-bold" id="titulo-form">Novo inventário</h2>
                        <p class="small suave mb-0" id="sub-form">Escolha a loja e a data.</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body vstack gap-3">
                    <div>
                        <label class="form-label small suave mb-1" for="busca-loja">Loja</label>
                        <input id="busca-loja" type="text" class="form-control" autocomplete="off" placeholder="Filial, nome ou cidade" role="combobox" aria-autocomplete="list" aria-controls="lista-lojas" aria-expanded="false">
                        <div class="invalid-feedback">Selecione uma loja da lista.
                        </div>
                        <div id="lista-lojas" class="list-group mt-1 lista-lojas d-none" role="listbox"></div>
                    </div>
                    <dl id="info-loja" class="row g-0 info-loja px-3 py-1 mb-0 d-none"></dl>
                    <div>
                        <label class="form-label small suave mb-1" for="i-data">Data do inventário</label>
                        <input id="i-data" type="date" class="form-control">
                        <div class="invalid-feedback">Informe a data.</div>
                    </div>
                    <div id="alerta-conflito" class="alert alert-danger small py-2 mb-0 d-none" role="alert"></div>
                    <div>
                        <label class="form-label small suave mb-1" for="i-equipe">Equipe</label>
                        <select id="i-equipe" class="form-select"><option
                                    value disabled selected>Selecione a
                                    equipe</option></select>
                        <div class="invalid-feedback">Informe a equipe.
                        </div>
                    </div>
                    <div>
                        <label class="form-label small suave mb-1" for="i-resp">Responsável</label>
                        <input id="i-resp" type="text" class="form-control" maxlength="80" placeholder="Nome do responsável">
                        <div class="invalid-feedback">Informe o responsável.

        const fromIso = s => {
            const p = s.split('-').map(Number);
            return new Date(p[0], p[1] - 1, p[2]);
        };
        const hojeIso = () => toIso(new Date());
        const addDias = (s, n) => {
            const d = fromIso(s);
            d.setDate(d.getDate() + n);
            return toIso(d);
        };
        const br = s => s ? s.split('-').reverse().join('/') : '';
        const dataLonga = s => {
            const d = fromIso(s);
            return `${DSEM_L[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`;

        const $ = s => document.querySelector(s);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
        const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        const curto = l => {
            if (!l) return '';
            const p = l.nome.split('-');
            return p.length > 2 ? p.slice(2).join('-') : l.nome;

        const novoId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + Math.random().toString(36).slice(2);

        /** Status pela data: futura = Agendado · hoje = Em andamento · passada = Finalizado */

        /* =====================================================================

        function carregar() {

        function persistir() {

        /* =====================================================================

        function filtrados() {
            const f = estado.filtros,
                termo = norm(f.busca);
            return estado.inventarios.filter(inv => {
                const l = lojaPor.get(inv.lojaCodigo);
                if (f.status && statusDe(inv) !== f.status) return false;
                if (f.uf && (!l || l.uf !== f.uf)) return false;
                if (f.equipe && inv.equipe !== f.equipe) return false;
                if (termo && !norm(`${inv.lojaCodigo} ${l ? l.nome : ''} ${l ? l.cidade : ''} ${inv.responsavel}`).includes(termo)) return false;
                return true;
            });

        function porData(lista) {
            const m = new Map();
            lista.forEach(i => {
                if (!m.has(i.data)) m.set(i.data, []);
                m.get(i.data).push(i);
            });
            m.forEach(l => l.sort((a, b) => a.lojaCodigo.localeCompare(b.lojaCodigo)));
            return m;
        }
        const conflito = (codigo, data, ignorar) => estado.inventarios.find(x => x.lojaCodigo === codigo && x.data === data && x.id !== ignorar);
        const ultimoFinalizado = (codigo, antes) => estado.inventarios

                    // cor do dia: prioridade Em andamento > Agendado > Finalizado (no mesmo dia todos têm o mesmo status)
                    const st = itens.length ? SIGLA[statusDe(itens[0])] : '';
                    const cls = ['dia', st, (dow === 0 || dow === 6) && !st && 'fds', iso === hoje && 'hoje'].filter(Boolean).join(' ');
                    const rot = itens.length ? `${br(iso)}: ${itens.map(tituloInv).join(', ')}` : `${br(iso)}: sem inventário`;
                    dias += `<button type="button" class="${cls}" data-dia="${iso}" aria-label="${esc(rot)}">${d}${itens.length > 1 ? `<span class="qtd">${itens.length}</span>` : ''}</button>`;
    }
    html += `<section class="mes${pref === hoje.slice(0, 7) ? ' atual' : ''}" aria-label="${MESES[m]} de ${ano}">
      <div class="mes-cab"><h2>${MESES[m]}</h2><span>${qtd ? `${qtd} inventário${qtd > 1 ? 's' : ''}` : '—'}</span></div>
      <div class="dsem">${DSEM.map(x => `<span>${x}</span>`).join('')}</div>
      <div class="dias">${dias}</div>
    </section>`;
  }
  $('#ano-grade').innerHTML = html;

  // resumo do ano (respeita filtros)
  const doAno = lista.filter(i => i.data.startsWith(String(ano)));
  const lojasFin = new Set(estado.inventarios.filter(i => i.data.startsWith(String(ano)) && statusDe(i) === 'Finalizado').map(i => i.lojaCodigo)).size;
  const prox = estado.inventarios.filter(i => i.data > hoje && i.data <= addDias(hoje, 7)).length;
  $('#resumo').innerHTML = `<b>${doAno.length}</b> inventários em ${ano} · <b>${lojasFin}</b> de ${LOJAS.length} lojas finalizadas · <b>${prox}</b> nos próximos 7 dias`;

  document.querySelectorAll('[data-leg]').forEach(b => b.classList.toggle('on', b.dataset.leg === estado.filtros.status));
  const f = estado.filtros;
  $('#btn-limpar').classList.toggle('d-none', !(f.busca || f.status || f.uf || f.equipe));
}

function abrirDia(dia, ancora) {
  const itens = porData(filtrados()).get(dia) || [];

function abrirDetalhe(id) {
  const inv = estado.inventarios.find(x => x.id === id); if (!inv) return;

      <button type="button" class="btn btn-sm btn-danger" data-acao="confirmar-exc">Excluir</button></div></div>`;
  posicionar(ancoraPop);
}

function posicionar(ancora) {
  pop.classList.remove('d-none');
  const r = ancora.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, m = 8;
  let x = r.right + m; if (x + w > innerWidth - m) x = r.left - w - m; if (x < m) x = Math.max(m, (innerWidth - w) / 2);
  let y = r.top - 8; if (y + h > innerHeight - m) y = innerHeight - h - m; if (y < m) y = m;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  const b = pop.querySelector('[data-acao="ver"], [data-acao="editar"]'); if (b) b.focus();
}
function fecharPop() {
  pop.classList.add('d-none'); estado.diaPop = null; estado.idPop = null;
  document.querySelectorAll('.dia.ativo').forEach(e => e.classList.remove('ativo'));
}

pop.addEventListener('click', e => {
  const alvo = e.target.closest('[data-acao]'); if (!alvo) return;
  const a = alvo.dataset.acao;
  if (a === 'fechar') fecharPop();
  else if (a === 'ver') abrirDetalhe(alvo.dataset.id);
  else if (a === 'voltar') abrirDia(estado.diaPop, ancoraPop);
  else if (a === 'novo') { const d = alvo.dataset.dia; fecharPop(); abrirNovo(d); }
  else if (a === 'editar') { const id = estado.idPop; fecharPop(); abrirEdicao(id); }
  else if (a === 'excluir') pop.querySelector('#conf-exc').classList.remove('d-none');
  else if (a === 'cancelar-exc') pop.querySelector('#conf-exc').classList.add('d-none');
  else if (a === 'confirmar-exc') {
    estado.inventarios = estado.inventarios.filter(x => x.id !== estado.idPop); persistir();
    render(); toast('Inventário excluído.');
  }
});
document.addEventListener('mousedown', e => {
  if (!pop.classList.contains('d-none') && !pop.contains(e.target) && !e.target.closest('[data-dia]')) fecharPop();
});

      class="list-group-item list-group-item-action d-flex gap-3 align-items-center py-2${i === estado.destaque ? ' active' : ''}">
      <span class="fw-bold tabular">${esc(l.codigo)}</span>
      <span class="d-flex flex-column lh-sm"><span class="fw-semibold">${esc(curto(l))}</span><small class="opacity-75">${esc(l.cidade)} / ${esc(l.uf)}</small></span></button>`).join('')
    : '<div class="list-group-item small suave">Nenhuma loja encontrada. Tente pelo número da filial.</div>';
  el.classList.remove('d-none'); $('#busca-loja').setAttribute('aria-expanded', 'true');
}
function fecharLista() { $('#lista-lojas').classList.add('d-none'); $('#busca-loja').setAttribute('aria-expanded', 'false'); }
function escolherLoja(cod) {
  estado.lojaSel = cod; $('#busca-loja').value = rotulo(lojaPor.get(cod)); $('#busca-loja').classList.remove('is-invalid');
  fecharLista(); infoLoja(); verConflito();
}
function infoLoja() {
  const el = $('#info-loja'), l = lojaPor.get(estado.lojaSel);
  if (!l) { el.classList.add('d-none'); el.innerHTML = ''; return; }
  const u = C.data.value ? ultimoFinalizado(l.codigo, C.data.value) : null;
  const it = (r, v, c) => `<div class="${c} py-2"><dt class="small fw-normal suave mb-1">${r}</dt><dd class="fw-semibold mb-0 text-break">${esc(v)}</dd></div>`;
  el.innerHTML = it('Filial', l.codigo, 'col-6 border-bottom') + it('Loja', curto(l), 'col-6 border-bottom') +
    it('Cidade / UF', `${l.cidade} / ${l.uf}`, 'col-12 border-bottom') + it('Endereço', l.endereco, 'col-12 border-bottom') +
    it('Último inventário finalizado', u ? br(u.data) : 'Sem registro', 'col-12');
  el.classList.remove('d-none');
}
function verConflito() {
  const el = $('#alerta-conflito');
  const c = estado.lojaSel && C.data.value ? conflito(estado.lojaSel, C.data.value, estado.editandoId) : null;
  el.classList.toggle('d-none', !c);
  el.textContent = c ? `Esta loja já tem inventário em ${br(c.data)}. Escolha outra data ou edite o registro existente.` : '';
  return c;
}
function validar() {
  let ok = true; const m = (el, inv) => { el.classList.toggle('is-invalid', inv); if (inv) ok = false; };
  m($('#busca-loja'), !estado.lojaSel); m(C.data, !C.data.value); m(C.equipe, !C.equipe.value); m(C.resp, !C.resp.value.trim());
  if (verConflito()) ok = false;
  return ok;
}
function toast(msg) { $('#toast-msg').textContent = msg; bootstrap.Toast.getOrCreateInstance($('#toast'), { delay: 2500 }).show(); }

const busca = $('#busca-loja');
busca.addEventListener('input', () => { estado.lojaSel = null; estado.destaque = 0; infoLoja(); verConflito(); renderLista(); });
busca.addEventListener('focus', renderLista);
busca.addEventListener('blur', () => setTimeout(fecharLista, 150));
busca.addEventListener('keydown', e => {
  const l = sugestoes(), aberta = !$('#lista-lojas').classList.contains('d-none');
  if (e.key === 'ArrowDown') { e.preventDefault(); estado.destaque = Math.min(estado.destaque + 1, l.length - 1); renderLista(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); estado.destaque = Math.max(estado.destaque - 1, 0); renderLista(); }
  else if (e.key === 'Enter' && aberta && l[estado.destaque]) { e.preventDefault(); escolherLoja(l[estado.destaque].codigo); }
  else if (e.key === 'Escape' && aberta) { e.preventDefault(); e.stopPropagation(); fecharLista(); }
});
$('#lista-lojas').addEventListener('mousedown', e => { const b = e.target.closest('[data-loja]'); if (b) { e.preventDefault(); escolherLoja(b.dataset.loja); } });
C.data.addEventListener('change', () => { infoLoja(); verConflito(); if (tentou) validar(); });
[C.equipe, C.resp].forEach(c => c.addEventListener('input', () => { if (tentou) validar(); }));

$('#form-inv').addEventListener('submit', e => {
  e.preventDefault(); tentou = true;
  if (!validar()) return;
  const reg = { id: estado.editandoId || novoId(), lojaCodigo: estado.lojaSel, data: C.data.value,
    equipe: C.equipe.value, responsavel: C.resp.value.trim(), observacao: C.obs.value.trim() };
  const i = estado.inventarios.findIndex(x => x.id === reg.id);
  if (i >= 0) estado.inventarios[i] = reg; else estado.inventarios.push(reg);
  persistir();
  estado.ano = fromIso(reg.data).getFullYear();
  modal.hide();
  toast(i >= 0 ? 'Inventário atualizado.' : 'Inventário cadastrado.');
});
$('#btn-excluir').addEventListener('click', () => {
  if (!confirmaExc) { confirmaExc = true; $('#btn-excluir').textContent = 'Confirmar exclusão'; return; }
  estado.inventarios = estado.inventarios.filter(x => x.id !== estado.editandoId); persistir();
  modal.hide(); toast('Inventário excluído.');
});
modalEl.addEventListener('shown.bs.modal', () => (estado.lojaSel ? C.data : busca).focus());
modalEl.addEventListener('hidden.bs.modal', () => { estado.editandoId = null; render(); });

/* =====================================================================
   EVENTOS GERAIS
   ===================================================================== */
$('#ano-grade').addEventListener('click', e => {
  const b = e.target.closest('[data-dia]'); if (!b) return;
  e.stopPropagation();
  if (estado.diaPop === b.dataset.dia) return fecharPop();
  abrirDia(b.dataset.dia, b);
});
const irAno = a => { estado.ano = a; render(); };

// Legenda funciona como atalho do filtro de status (clicar de novo desliga)
document.querySelectorAll('[data-leg]').forEach(b => b.addEventListener('click', () => {
  const s = estado.filtros.status === b.dataset.leg ? '' : b.dataset.leg;
  estado.filtros.status = s; $('#f-status').value = s; render();
}));

// Prévia rápida ao passar o mouse sobre um dia
const previa = $('#previa');
$('#ano-grade').addEventListener('mouseover', e => {
  const b = e.target.closest('[data-dia]');
  if (!b || !pop.classList.contains('d-none')) return previa.classList.add('d-none');
  const dia = b.dataset.dia, itens = porData(filtrados()).get(dia) || [];
  const max = 5;
  previa.innerHTML = `<b>${dataLonga(dia)}</b>` + (itens.length
    ? itens.slice(0, max).map(i => `<div class="ln"><span class="quad q-${SIGLA[statusDe(i)]}" style="width:9px;height:9px"></span>${esc(tituloInv(i))}</div>`).join('')
      + (itens.length > max ? `<div class="ln">+${itens.length - max} outros</div>` : '') + '<div class="acao">Clique para ver detalhes</div>'
    : '<div class="acao">Sem inventário · clique para cadastrar</div>');
  previa.classList.remove('d-none');
  const r = b.getBoundingClientRect(), w = previa.offsetWidth, h = previa.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, innerWidth - w - 8));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  previa.style.left = x + 'px'; previa.style.top = y + 'px';
});
$('#ano-grade').addEventListener('mouseleave', () => previa.classList.add('d-none'));
$('#ano-grade').addEventListener('mousedown', () => previa.classList.add('d-none'));
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => irAno(estado.ano + Number(b.dataset.nav))));
$('#btn-novo').addEventListener('click', () => abrirNovo(estado.ano === new Date().getFullYear() ? hojeIso() : `${estado.ano}-01-01`));

$('#f-busca').addEventListener('input', e => { estado.filtros.busca = e.target.value; render(); });
$('#f-status').addEventListener('change', e => { estado.filtros.status = e.target.value; render(); });
$('#f-uf').addEventListener('change', e => { estado.filtros.uf = e.target.value; render(); });
$('#f-equipe').addEventListener('change', e => { estado.filtros.equipe = e.target.value; render(); });
$('#btn-limpar').addEventListener('click', () => {
  estado.filtros = { busca: '', status: '', uf: '', equipe: '' };
  ['#f-busca', '#f-status', '#f-uf', '#f-equipe'].forEach(s => { $(s).value = ''; });
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !pop.classList.contains('d-none')) { fecharPop(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || modalEl.classList.contains('show')) return;
  if (e.target.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowLeft') irAno(estado.ano - 1);
  else if (e.key === 'ArrowRight') irAno(estado.ano + 1);
  else if (k === 't') irAno(new Date().getFullYear());
  else if (k === 'c') $('#btn-novo').click();
  else return;
  e.preventDefault();
});
addEventListener('resize', () => { if (!pop.classList.contains('d-none')) fecharPop(); });

// Virada do dia: status (Agendado → Em andamento → Finalizado) e destaque de hoje
let diaAtual = hojeIso();
setInterval(() => { if (hojeIso() !== diaAtual) { diaAtual = hojeIso(); render(); } }, 60000);

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
const opts = (sel, vals) => $(sel).insertAdjacentHTML('beforeend', vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join(''));
opts('#f-status', STATUS);
opts('#f-uf', [...new Set(LOJAS.map(l => l.uf))].sort());
opts('#f-equipe', EQUIPES);
opts('#i-equipe', EQUIPES);
render();
    </script>
</body>

</html>
